<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anlegg</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anlegg">
<meta name="theme-color" content="#1c1d20">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="homey-ikon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Barlow+Condensed:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Hybrid: anleggsskjema (D) som grunnmur, rundmålere (B) for nøkkelverdier, sikkerhet + fukt-kort (A). Tre layoutvarianter. */
:root{
  --bg:#0a1219; --s:#0f1b25; --s2:#132230; --line:#1f3242; --grid:rgba(120,170,210,.055);
  --t:#d9e6ef; --m:#7f97a8; --d:#4d6577; --cy:#5fc8e8;
  --ok:#4fc38c; --warn:#f0b13c; --crit:#ef5d5d;
  --okb:rgba(79,195,140,.12); --warnb:rgba(240,177,60,.13); --critb:rgba(239,93,93,.14);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --sans:"IBM Plex Sans",system-ui,sans-serif; --gnum:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--t);font-family:var(--sans);font-size:14.5px;line-height:1.45;
  background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px;}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.num{font-variant-numeric:tabular-nums}

/* Velger */
.switch{position:sticky;top:0;z-index:20;background:rgba(10,18,25,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.switch .in{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;align-items:center;overflow-x:auto}
.switch .lab{font-size:12px;color:var(--m);white-space:nowrap;margin-right:4px}
.switch button{font:500 13px var(--sans);color:var(--t);background:transparent;border:1px solid var(--line);border-radius:99px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.switch button:hover{border-color:#36536a}
.switch button[aria-pressed="true"]{background:var(--t);color:var(--bg);border-color:var(--t)}
.switch button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.switch .ver{margin-left:auto;font:12px var(--mono);color:var(--d);white-space:nowrap;padding-left:12px}
.v{display:none}.v.on{display:block}
.wrap{max-width:1400px;margin:0 auto;padding:20px 24px 40px;display:flex;flex-direction:column;gap:14px}

/* Felles: topp */
.hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.hd h1{font:500 18px var(--mono);letter-spacing:.06em;margin:0;text-transform:uppercase}
.hd .meta{font:12px var(--mono);color:var(--m);display:flex;gap:12px;flex-wrap:wrap}
.hd .meta b{font-weight:500}

/* Felles: paneler (D) */
.panel{border:1px solid var(--line);background:rgba(15,27,37,.88);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0;font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--m)}
.ph small{font:12px var(--sans);letter-spacing:0;text-transform:none;color:var(--d)}
.tag{font:500 10.5px var(--mono);padding:2px 7px;border-radius:3px;letter-spacing:.06em;white-space:nowrap}
.tag.ok{color:var(--ok);background:var(--okb)}.tag.warn{color:var(--warn);background:var(--warnb)}.tag.crit{color:var(--crit);background:var(--critb)}.tag.n{color:var(--m);background:var(--s2)}

/* Bygningsblokker (D) */
.blk{border:1.5px solid var(--line);background:rgba(15,27,37,.9);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.blk.ok{border-color:rgba(79,195,140,.5)}.blk.warn{border-color:rgba(240,177,60,.7)}.blk.crit{border-color:rgba(239,93,93,.8);box-shadow:0 0 0 3px rgba(239,93,93,.1)}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.rm{border:1px dashed var(--line);border-radius:4px;padding:8px 10px;font-size:12px;color:var(--m);display:flex;flex-direction:column;gap:1px;min-width:0}
.rm.warn{border:1px solid rgba(240,177,60,.7)}.rm.crit{border:1px solid rgba(239,93,93,.8)}
.rm b{color:var(--t);font:500 16px var(--mono)}

/* Rundmålere (B) */
.gauge{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.gauge svg{width:100%;max-width:150px;aspect-ratio:1;display:block}
.gauge .gl{font:500 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--m);text-align:center}
.gauge .gf{font-size:12px;color:var(--m);text-align:center}
.gstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line);border-radius:6px;background:rgba(15,27,37,.88);overflow:hidden}
.gstrip .gauge{padding:14px 10px;border-right:1px solid var(--line)}
.gstrip .gauge:last-child{border-right:0}

/* Sikkerhet (A) */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0;padding-top:2px}
.row .nm{font-weight:500}
.row .dt{grid-column:1/-1;color:var(--m);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--okb)}.pill.warn{color:var(--warn);background:var(--warnb)}.pill.crit{color:var(--crit);background:var(--critb)}.pill.n{color:var(--m);background:var(--s2)}

/* Fukt og rust (A) */
.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.zones.two{grid-template-columns:1fr 1fr}
.zone{background:var(--s2);border-radius:10px;padding:12px;border-top:3px solid var(--line);display:flex;flex-direction:column;gap:5px;min-width:0}
.zone.ok{border-top-color:var(--ok)}.zone.warn{border-top-color:var(--warn)}.zone.crit{border-top-color:var(--crit)}
.zone .zn{display:flex;justify-content:space-between;gap:6px;font-size:13px;color:var(--m);align-items:center}
.zone .rh{font-size:28px;font-weight:500;line-height:1.1}.zone .rh small{font-size:14px;color:var(--m);font-weight:400}
.zone .ex{font-size:12px;color:var(--m)}
.nohist{height:40px;display:flex;align-items:center;font-size:11.5px;color:var(--d)}

/* Logg (D) */
.log{font:12.5px var(--mono);display:flex;flex-direction:column;gap:7px}
.log div{display:grid;grid-template-columns:48px 58px 1fr;gap:8px;align-items:start}
.log .t{color:var(--m)}
.phase{display:grid;grid-template-columns:26px 1fr 54px;gap:8px;align-items:center;font:12.5px var(--mono)}
.phase .tr{height:8px;background:#13222e;border-radius:2px;position:relative}
.phase .tr i{position:absolute;inset:0 auto 0 0;background:var(--cy);border-radius:2px}
.foot{font:11px var(--mono);color:var(--d)}

/* ===== Variant 1: Målerstripe + skjema ===== */
.v1 .site{display:grid;grid-template-columns:1.5fr 1fr 1.5fr;gap:14px;align-items:start}
.v1 .mid{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start}
.v1 .low{display:grid;grid-template-columns:2fr 1fr;gap:14px}

/* ===== Variant 2: Målere inne i byggene ===== */
.v2 .main{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
.v2 .site{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.v2 .blk .inner{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center}
.v2 .blk .inner .gauge svg{max-width:132px}
.v2 .side{display:flex;flex-direction:column;gap:14px}

/* ===== Variant 3: Kontrollpult ===== */
.v3 .desk{display:grid;grid-template-columns:minmax(320px,1fr) minmax(420px,1.45fr) minmax(300px,.95fr);gap:14px;align-items:start}
.v3 .col{display:flex;flex-direction:column;gap:14px;min-width:0}
.v3 .map{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:auto;gap:6px}
.v3 .map .cell{border:1.5px solid var(--line);border-radius:4px;padding:5px 7px;font:500 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;justify-content:space-between;color:var(--m);background:rgba(19,34,48,.6);min-width:0;overflow:hidden;min-height:46px}
.v3 .map .cell b{font:500 13px var(--mono);color:var(--t);text-transform:none;letter-spacing:0}
.v3 .map .cell.ok{border-color:rgba(79,195,140,.5)}.v3 .map .cell.warn{border-color:rgba(240,177,60,.75);background:rgba(240,177,60,.06)}.v3 .map .cell.crit{border-color:rgba(239,93,93,.85);background:rgba(239,93,93,.08)}
.v3 .map .lbl{grid-column:1/-1;font:11px var(--mono);color:var(--d);letter-spacing:.1em;padding-top:6px}
.v3 .g4{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:6px;background:rgba(15,27,37,.88);overflow:hidden}
.v3 .g4 .gauge{padding:14px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.v3 .g4 .gauge:nth-child(2n){border-right:0}.v3 .g4 .gauge:nth-last-child(-n+2){border-bottom:0}
.v3 .g4 .gauge svg{max-width:170px}

/* ===== Responsiv ===== */
@media(max-width:1150px){
  .gstrip{grid-template-columns:repeat(3,1fr)}
  .gstrip .gauge{border-bottom:1px solid var(--line)}
  .v1 .site{grid-template-columns:1fr 1fr}.v1 .site .house{grid-column:span 2}
  .v1 .mid,.v1 .low{grid-template-columns:1fr}
  .v2 .main{grid-template-columns:1fr}
  .v3 .desk{grid-template-columns:1fr 1fr}.v3 .desk .center{grid-column:span 2;order:-1}
}
@media(max-width:640px){
  .wrap{padding:14px 14px 30px;gap:12px}
  .hd h1{font-size:15px}
  .gstrip{grid-template-columns:1fr 1fr}
  .gstrip .gauge:nth-child(5){grid-column:span 2}
  .v1 .site{grid-template-columns:1fr}.v1 .site .house{grid-column:auto}
  .zones{grid-template-columns:1fr 1fr}
  .v2 .site{grid-template-columns:1fr}
  .v2 .blk .inner{grid-template-columns:110px 1fr}
  .v3 .desk{display:flex;flex-direction:column;align-items:stretch}.v3 .col{display:contents}
  .o-logg{order:1}.o-sik{order:2}.o-g4{order:3}.o-fukt{order:4}.o-vaer{order:5}.o-graf{order:6}.o-map{order:7}.o-faser{order:8}
  .log div{grid-template-columns:40px 54px 1fr}
}
@media (prefers-reduced-motion:no-preference){.v.on{animation:fade .25s ease}@keyframes fade{from{opacity:.4}to{opacity:1}}}

/* v1.4: tilkobling, innstillinger, vær */
.conn{display:inline-flex;align-items:center;gap:6px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--d)}
.conn.live i{background:var(--ok);box-shadow:0 0 0 3px rgba(79,195,140,.18)}
.conn.err i{background:var(--crit)}
.conn.wait i{background:var(--warn)}
.btn{font:500 12px var(--mono);letter-spacing:.06em;color:var(--t);background:var(--s2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
.btn:hover{border-color:#36536a}
.btn:focus-visible,.inp:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.btn.pri{background:var(--cy);color:#04141c;border-color:var(--cy)}
.banner{border:1px solid rgba(240,177,60,.5);background:rgba(240,177,60,.08);border-radius:6px;padding:10px 14px;font-size:13px;display:none}
.banner.on{display:block}
.banner.err{border-color:rgba(239,93,93,.6);background:rgba(239,93,93,.08)}
.banner code{font:12px var(--mono)}
dialog{border:1px solid var(--line);background:var(--s);color:var(--t);border-radius:8px;padding:0;max-width:460px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(3,8,12,.7)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:12px}
dialog h2{margin:0;font:500 15px var(--mono);letter-spacing:.06em;text-transform:uppercase}
dialog p{margin:0;color:var(--m);font-size:13px}
dialog label{font-size:12.5px;color:var(--m);display:flex;flex-direction:column;gap:5px}
.inp{font:13px var(--mono);color:var(--t);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 10px;width:100%}
.dlgbtns{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.wx-now{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wx-box{background:var(--s2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.wx-box .src{font:11px var(--mono);color:var(--m);letter-spacing:.08em;text-transform:uppercase}
.wx-box .t{font:400 30px var(--gnum);line-height:1.1}
.wx-box .d{font-size:12px;color:var(--m)}
.delta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.delta div{background:var(--s2);border-radius:8px;padding:7px 10px;display:flex;flex-direction:column;font-size:12px;color:var(--m)}
.delta b{color:var(--t);font:500 15px var(--mono)}
.fc{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.fc .h{background:var(--s2);border-radius:6px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font:11px var(--mono);color:var(--m)}
.fc .h b{color:var(--t);font:500 13px var(--mono)}
.fc svg{width:22px;height:22px;color:var(--t)}
.stale{opacity:.55}
@media(max-width:640px){.fc{grid-template-columns:repeat(4,1fr)}.wx-now{grid-template-columns:1fr}}
@media(max-width:640px){.o-vaer{order:5}}
.luft{background:var(--s2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--line)}
.luft.ok{border-left-color:var(--ok)}.luft.warn{border-left-color:var(--warn)}
.luft .lh{display:flex;justify-content:space-between;align-items:center;font-weight:500;gap:8px}
.luft .lg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.luft .lg div{display:flex;flex-direction:column;font-size:11px;color:var(--m)}
.luft .lg b{font:500 15px var(--mono);color:var(--t)}
.luft .lg small{font-size:10.5px;color:var(--d)}
.luft .lw{font-size:12px;color:var(--m)}
.wrap{padding-top:max(20px,env(safe-area-inset-top));padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
@media(max-width:640px){.wrap{padding-top:max(14px,env(safe-area-inset-top));padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}.hd .meta{font-size:11px;gap:8px}}
.hdmeta{align-items:center;gap:10px}
.cnt{display:inline-flex;gap:6px}
.btn.icon{padding:6px;line-height:0;color:var(--m)}
.btn.icon:hover{color:var(--t)}
.conn span{font:12px var(--mono);color:var(--m)}
@media(max-width:640px){.hd{align-items:center}.hdmeta{gap:8px}}
.tt{display:flex;align-items:baseline;gap:10px}
.tt .ver{font:12px var(--mono);color:var(--d);border:1px solid var(--line);border-radius:99px;padding:1px 8px;letter-spacing:.04em}

/* ===== v2.2: Tema A «Kobber taktil» ===== */
:root{--bg:#1c1d20;--s:#232428;--s2:#1b1c1f;--line:#2f3136;--grid:transparent;--t:#ece7e1;--m:#9a948d;--d:#615c57;--cy:#d4703c;
  --ok:#5fbf8f;--warn:#e8c23a;--crit:#ff5a4f;--okb:rgba(95,191,143,.14);--warnb:rgba(232,194,58,.14);--critb:rgba(255,90,79,.15);
  --raise:6px 6px 14px #121315,-4px -4px 12px #2b2d32;--inset:inset 4px 4px 9px #121315,inset -3px -3px 8px #2b2d32;--edge:1px solid rgba(255,255,255,.03)}
html,body{background:var(--bg)!important;background-image:none!important;color:var(--t)}
.wrap{gap:16px}
.panel{background:var(--s)!important;border:var(--edge)!important;border-radius:16px!important;box-shadow:var(--raise)}
.ph{font:600 13px var(--gnum)!important;letter-spacing:.16em!important;color:var(--m)}
.ph small{font:12px var(--sans)!important;letter-spacing:0!important}
.tt h1{font:500 26px var(--gnum)!important;letter-spacing:.14em!important}
.v3 .desk{gap:16px}.v3 .col{gap:16px}
.v3 .g4{border:0!important;background:none!important;overflow:visible!important;gap:16px}
.v3 .g4 .gauge{border:var(--edge)!important;border-radius:16px;background:var(--s);box-shadow:var(--raise);padding:16px 10px 14px}
.gauge .gl{font:600 12px var(--gnum)!important;letter-spacing:.18em!important}
.v3 .map{gap:7px}
.v3 .map .lbl{font:600 11px var(--gnum)!important;letter-spacing:.18em!important}
.v3 .map .cell{border-radius:10px;background:var(--s2)!important;box-shadow:var(--inset);border:1px solid transparent!important;font-family:var(--gnum)!important;letter-spacing:.1em!important;font-size:10.5px!important}
.v3 .map .cell.warn{border-color:var(--warn)!important;background:linear-gradient(180deg,var(--warnb),var(--s2))!important}
.v3 .map .cell.crit{border-color:var(--crit)!important;background:linear-gradient(180deg,var(--critb),var(--s2))!important}
.pill{box-shadow:3px 3px 6px #121315,-2px -2px 5px #2b2d32}
.pill.n{background:var(--s)!important}
.tag{border-radius:99px!important;padding:3px 9px!important;box-shadow:3px 3px 6px #121315,-2px -2px 5px #2b2d32}
.zone,.luft,.wx-box,.delta div,.fc .h{border-radius:10px!important;background:var(--s2)!important;box-shadow:var(--inset)}
.zone{border-top:0!important;position:relative;overflow:hidden}
.zone::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--line)}
.zone.ok::before{background:var(--ok)}.zone.warn::before{background:var(--warn)}.zone.crit::before{background:var(--crit)}
.zone .rh{font:400 34px var(--gnum)!important;line-height:1!important}
.luft{border-left:0!important}
.phase .tr{background:var(--s2)!important;box-shadow:var(--inset);height:10px!important;border-radius:6px!important}
.phase .tr i{border-radius:6px!important}
.btn{background:var(--s)!important;border:var(--edge)!important;box-shadow:var(--raise);border-radius:99px!important}
.btn.icon{width:34px;height:34px;display:grid;place-items:center;padding:0!important}
.btn.pri{background:linear-gradient(180deg,#e0824a,#b9572a)!important;color:#1c1d20!important}
.ver{border-color:var(--line)!important;color:var(--d)!important}
.banner{border-radius:12px!important}
dialog{background:var(--s)!important;border:var(--edge)!important;border-radius:16px!important;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.inp{background:var(--s2)!important;border:1px solid var(--line)!important;box-shadow:var(--inset);border-radius:8px!important}
.v3 .map .cell.room b{font-size:15px}
.v3 .map .cell .co2{font:500 12px var(--mono);letter-spacing:0;text-transform:none;color:var(--m);display:flex;align-items:center;gap:4px;white-space:nowrap}
.v3 .map .cell.warn .co2,.v3 .map .cell.crit .co2{color:var(--t)}
.tr{font-style:normal;font-size:10px;line-height:1}
.tr.up{color:var(--warn)}.tr.dn{color:var(--ok)}.tr.fl{color:var(--d)}

/* v2.4 */
[data-det]{cursor:pointer;transition:transform .12s ease}
[data-det]:hover{transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){[data-det]{transition:none}[data-det]:hover{transform:none}}
.ev .evg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ev .evg div{background:var(--s2);box-shadow:var(--inset);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--m)}
.ev .evg b{font:400 28px var(--gnum);color:var(--t);line-height:1.05}
.ev .evg b small{font-size:13px;color:var(--m)}
.c-ok{color:var(--ok)!important}.c-warn{color:var(--warn)!important}.c-crit{color:var(--crit)!important}
.evbar{position:relative;height:18px;border-radius:9px;background:var(--s2);box-shadow:var(--inset);overflow:hidden}

<body>

</main>

<dialog id="dlg">
  <form id="dlgForm" method="dialog">

    <label for="fName">Navn på dashbordet (valgfritt)
      <input class="inp" id="fName" name="fName" autocomplete="off" placeholder="f.eks. Hjemme">
    </label>

      <input class="inp" id="fBase" name="fBase" autocomplete="off" placeholder="http://192.168.1.50">

      <span style="display:flex;gap:8px"><button class="btn" id="dlgCancel" type="button">Avbryt</button><button class="btn pri" type="submit">Lagre og koble til</button></span>
    </div>
  </form>
</dialog>
<dialog id="det" class="detdlg">
  <div class="detin">
    <div class="dethd"><h2 id="detTitle">Detaljer</h2>
      <div class="seg" role="group" aria-label="Periode"><button type="button" data-r="lastHour" aria-pressed="false">1 t</button><button type="button" data-r="last12Hours" aria-pressed="false">12 t</button><button type="button" data-r="last24Hours" aria-pressed="true">24 t</button><button type="button" data-r="last7Days" aria-pressed="false">7 døgn</button><button type="button" data-r="last31Days" aria-pressed="false">30 døgn</button></div>
      <button class="btn" id="detClose" type="button">Lukk</button></div>
    <div id="detBody"></div>
  </div>
</dialog>
<script>
/* ================= Homey Dashbord v1.4 – levende data ================= */
const VERSION='v4.5';
// Personlige opplysninger (posisjon, stedsnavn, romnavn) lagres bare lokalt på enheten – aldri i fila
const PRIV=(()=>{ try{ return JSON.parse(localStorage.getItem('anlegg.priv')||'{}'); }catch(e){ return {}; } })();
let LAT=+PRIV.lat||null, LON=+PRIV.lon||null; const STED=()=>PRIV.sted||'';
const RN=k=>(PRIV.rom&&PRIV.rom[k])||({stue:'Stue',martine:'Soverom 1',jm:'Soverom 2',julie:'Soverom 3',loftstue:'Loftstue'})[k]||k;

/* Enhets-ID-er fra Homey */
const ID={
  led:'73c9134b-68e6-4329-9df2-af34f9a963b2', katteluke:'f4bab299-a6b5-44a9-8447-c55ff50a09e2',
  pulse:'5185db17-27ee-4ab1-aa35-5b400a0b6017', easee:'0b1c770b-9a21-462f-bfab-b24a1f0fb61d',
  ute:'b4e718ce-4411-4991-add2-67ee6d2aed05', vind:'6bf7284f-c5be-4cd2-a0e0-d69d2c943134',
  garasje:'d99bbf63-99aa-4ad4-ae18-5865c506df70', hevda:'1d2250ac-902c-485a-ace6-56cc174f11ec',
  loe:'094ea773-72e8-4b71-a583-64fe5844540e', snekker:'7d0b1e4b-518a-4466-9fb2-fb57dad12c49',
  stue:'d6e44d4d-3b2e-4c8d-9b12-0528caa8e5cd', jm:'2c1ce211-d605-422b-9cbe-b1d65be224a4',
  julie:'2e411208-5bd2-46f1-be1b-1fb2dd9eb6ac', martine:'f1376a81-3ff0-43f3-9f6c-6a94b40cc153',
  loftstue:'885aab64-9f31-4fc0-8a03-be449ca06a75', vent:'6ec1e65c-3b82-4102-a5ad-b86628d34ab2',
  pumpe:'8a35f44d-7210-474d-8470-fc130f2011b2', port:'7110c171-b560-475a-8618-ae5d5a8abacd',
  dorLoe:'564d8a93-5b58-4626-84aa-366b5ffb5440', vann:'fec3d8e5-9c6f-4d98-9a71-3a4f56bff0c3',
  bev:'ce4dca7f-8c29-4d04-991f-5e9364dd85e6'
};

/* Grenser (valgt i intervjuet) */
const STILLE_T=2; // timer uten rapport før sensor regnes som falt ut
const STILLE_SENS=['pulse','ute','vind','garasje','hevda','loe','snekker','stue','jm','julie','martine','loftstue','vent'];
const PUMPE_W=300; // KP150 lensepumpe, watt når den går
const LIM={rhWarn:70, rhCrit:80, co2Warn:1000, co2Crit:1400, batt:25, portMin:15, portHour:22, dorFra:22, dorTil:8, step:5, ventStop:10};

/* ---------- Tilstand ---------- */
const S={lastOk:null,histSrc:'snap',histErr:null,stepSrc:'snap',mode:'snap', time:new Date(), dev:{}, lastUpd:{}, batt:[], hist:{}, step:null, yr:null, err:null};

/* ---------- Hjelpere ---------- */
const C={ok:'#5fbf8f',warn:'#e8c23a',crit:'#ff5a4f',cy:'#d4703c'};
const f=(v,d=1)=>(v==null||isNaN(v))?'–':Number(v).toFixed(d).replace('.',',');
const dew=(t,rh)=>{if(t==null||rh==null)return null;const a=17.62,b=243.12,g=Math.log(rh/100)+a*t/(b+t);return b*g/(a-g)};
const rhSt=rh=>rh==null?'n':rh>LIM.rhCrit?'crit':rh>LIM.rhWarn?'warn':'ok';
const co2St=v=>v==null?'n':v>=LIM.co2Crit?'crit':v>=LIM.co2Warn?'warn':'ok';
const lblSt={ok:'OK',info:'Fuktig',warn:'Fuktkilde',crit:'Kondens',n:'–'};
/* Fukt i uoppvarmede bygg: farge bare når noe bør gjøres.
   crit = kondensfare (RF ≥ 90 % eller duggpunkt < 1 °C under lufta)
   warn = fuktkilde (mer enn 1,5 g/m³ mer vann i lufta inne enn ute i minst 2 t)
   info = fuktig (≥ 80 %, normalt for årstiden) · ok = under 80 % */
const FUKT={rfKondens:90, duggMargin:1.0, kildeAH:1.5, kildeMin:120, rfFuktig:80};
const FK_MEM=(()=>{ try{ return JSON.parse(localStorage.getItem('anlegg.fuktkilde')||'{}'); }catch(e){ return {}; } })();
function fuktSt(id){
  const t=v(id,'measure_temperature'), rh=v(id,'measure_humidity'); if(rh==null) return {s:'n'};
  const dp=t!=null?dew(t,rh):null, margin=dp!=null?t-dp:null;
  const tU=v(ID.ute,'measure_temperature'), rU=v(ID.ute,'measure_humidity');
  const dAH=(t!=null&&tU!=null&&rU!=null)?absFukt(t,rh)-absFukt(tU,rU):null;
  // hvor lenge har fuktkilden vart (huskes per enhet)
  const now=Date.now();
  if(dAH!=null&&dAH>FUKT.kildeAH){ if(!FK_MEM[id]) FK_MEM[id]=now; } else delete FK_MEM[id];
  try{ localStorage.setItem('anlegg.fuktkilde',JSON.stringify(FK_MEM)); }catch(e){}
  const kildeMin=FK_MEM[id]?(now-FK_MEM[id])/60000:0;
  if(rh>=FUKT.rfKondens||(margin!=null&&margin<FUKT.duggMargin)) return {s:'crit',rh,t,dp,margin,dAH,why:`kondensfare – RF ${f(rh,0)} %, duggpunkt ${f(margin,1)} °C under lufta`};
  if(dAH!=null&&dAH>FUKT.kildeAH&&kildeMin>=FUKT.kildeMin) return {s:'warn',rh,t,dp,margin,dAH,why:`fuktkilde – ${f(dAH,1)} g/m³ mer vann i lufta inne enn ute i ${varTxt(kildeMin*60000)}`};
  if(rh>=FUKT.rfFuktig) return {s:'info',rh,t,dp,margin,dAH};
  return {s:'ok',rh,t,dp,margin,dAH};
}
const v=(id,cap)=>S.dev[id]?.[cap];
const tz='Europe/Oslo';
const hhmm=d=>new Intl.DateTimeFormat('nb-NO',{timeZone:tz,hour:'2-digit',minute:'2-digit'}).format(d);
const dato=d=>new Intl.DateTimeFormat('nb-NO',{timeZone:tz,day:'2-digit',month:'2-digit',year:'numeric'}).format(d);
const dirTxt=a=>a==null?'':['N','NØ','Ø','SØ','S','SV','V','NV'][Math.round(((a%360)+360)%360/45)%8];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,val){try{localStorage.setItem(k,val)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

function spark(data,color,{h=40,min,max,thr}={}){
  if(!data||data.length<2) return '<div class="nohist">Ingen historikk</div>';
  const w=300,lo=min??Math.min(...data),hi=max??Math.max(...data),sp=(hi-lo)||1,p=3;
  const x=i=>p+i*(w-2*p)/(data.length-1),y=val=>h-p-(Math.min(Math.max(val,lo),hi)-lo)/sp*(h-2*p);
  const d=data.map((q,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(q).toFixed(1)}`).join('');
  const id='g'+Math.random().toString(36).slice(2,8);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block" aria-hidden="true">
   <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".3"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
   ${thr!=null?`<line x1="0" x2="${w}" y1="${y(thr)}" y2="${y(thr)}" stroke="${color}" stroke-opacity=".4" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>`:''}
   <path d="${d}L${x(data.length-1)},${h}L${x(0)},${h}Z" fill="url(#${id})"/>
   <path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
   <circle cx="${x(data.length-1)}" cy="${y(data.at(-1))}" r="2.5" fill="${color}"/></svg>`;
}
function ring(val,min,max,{unit,color,marks=[],dec=1}){
  /* Måler i «glød»-stil (fra tema B): tynn lysende bue med lyspunkt */
  const r=56,cx=75,cy=75,a0=225,sw=270,fr=val==null?0:Math.min(1,Math.max(0,(val-min)/(max-min)));
  const pt=(a,rr=r)=>{const q=(a-90)*Math.PI/180;return[cx+rr*Math.cos(q),cy+rr*Math.sin(q)]};
  const arc=(s,e)=>{const[x0,y0]=pt(s),[x1,y1]=pt(e);return `M${x0},${y0}A${r},${r} 0 ${e-s>180?1:0} 1 ${x1},${y1}`};
  const end=Math.max(a0+.5,a0+sw*fr),[kx,ky]=pt(end), id='r'+Math.random().toString(36).slice(2,7);
  const tk=marks.map(m=>{const a=a0+sw*(m-min)/(max-min),[x0,y0]=pt(a,r-8),[x1,y1]=pt(a,r+8);return `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#9a948d" stroke-width="1.4"/>`}).join('');
  return `<svg viewBox="0 0 150 150" role="img" aria-label="${f(val,dec)} ${unit}"><defs><filter id="${id}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
   <circle cx="75" cy="75" r="67" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
   <path d="${arc(a0,a0+sw)}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="5" stroke-linecap="round"/>
   ${val==null?'':`<path d="${arc(a0,end)}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" filter="url(#${id})"/>`}${tk}
   ${val==null?'':`<circle cx="${kx}" cy="${ky}" r="4.8" fill="#fff" opacity=".92" filter="url(#${id})"/>`}
   <text x="75" y="83" text-anchor="middle" fill="#ece7e1" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="300" font-size="40">${f(val,dec)}</text>
   <text x="75" y="104" text-anchor="middle" fill="#9a948d" font-family="IBM Plex Mono, monospace" font-size="10.5">${unit}</text></svg>`;
}
const gauge=(l,svg,ft)=>`<div class="gauge"><div class="gl">${l}</div>${svg}<div class="gf num">${ft}</div></div>`;
const rm=(n,val,sub,st='')=>`<div class="rm ${st}"><span>${n}</span><b class="num">${val}</b><span class="num">${sub}</span></div>`;


/* ---------- Løe: dør + bevegelse (skiller person fra katt) ---------- */
const PERSON_FOR_MIN=10, PERSON_ETTER_MIN=2;
function tolkBevegelse(t){
  const d=(S.doorEv||[]).some(o=>{const x=o.getTime(), m=t.getTime(); return x>=m-PERSON_FOR_MIN*60000 && x<=m+PERSON_ETTER_MIN*60000;});
  return d?'person':'katt';
}
const tidTxt=t=>(dato(t)===dato(new Date())?'':(dato(t)===dato(new Date(Date.now()-86400000))?'i går ':dato(t).slice(0,5)+' '))+hhmm(t);
function loeTekst(){
  const m=S.motion||[], d=S.doorEv||[];
  const lm=m.length?m[m.length-1]:S.lastUpd[ID.bev+':alarm_motion'];

/* ---------- Effektvakt: snitt så langt denne timen og prognose ---------- */
function effektvakt(){
  const now=Date.now(), hs=Math.floor(now/3600000)*3600000, el=(now-hs)/60000, nowW=v(ID.pulse,'measure_power');
  if(nowW==null) return null;
  let eMin=0, cov=0, lastEnd=hs;
  (S.pw5||[]).forEach(b=>{const t=b.t.getTime(); if(t>=hs && t+300000<=now+60000){ eMin+=b.v*5; cov+=5; lastEnd=Math.max(lastEnd,t+300000);} });
  const live=(S.pwLive||[]).filter(x=>x.t>=lastEnd);
  if(live.length){ const a=live.reduce((s,x)=>s+x.w,0)/live.length, m=Math.max(0,(now-lastEnd)/60000); eMin+=a*m; cov+=m; }
  if(cov<1){ eMin=nowW*Math.max(el,1); cov=Math.max(el,1); }
  const avg=eMin/cov, rest=Math.max(0,60-el);
  const proj=(avg*el+nowW*rest)/60;
  const allowed=rest>1?(LIM.step*1000*60-avg*el)/rest:null;
  const st=proj>LIM.step*1000?'crit':proj>LIM.step*1000*0.9?'warn':'ok';
  return {avg,proj,allowed,el,rest,st};
}
/* ---------- Priser (fra Lyse-faktura oktober 2026, alle inkl. mva) ----------
   Strøm: Norgespris 50,00 øre + påslag Lyse 5,90 øre/kWh + 55 kr/mnd.
   Nettleie KE Nett fra 1.10.2026: energiledd dag 30,00 / natt 16,25 øre,
   forbruksavgift 8,91 og Enova 1,25 øre/kWh, effektledd 0–5 kW 262,50 kr/mnd.
   Dag = hverdager kl. 06–22, natt = resten, helg og helligdager. */
const TARIFF={norgespris:50.00, paslag:5.90, lyseMnd:55.00,
  nettDag:30.00, nettNatt:16.25, avgift:8.91+1.25,
  effekt:[[5,262.50]] /* [øvre grense kW, kr/mnd]. Pris over 5 kW er ikke kjent ennå */};
const HELLIG=new Set(['2026-01-01','2026-04-02','2026-04-03','2026-04-06','2026-05-01','2026-05-14','2026-05-17','2026-05-25','2026-12-25','2026-12-26',
  '2027-01-01','2027-03-25','2027-03-26','2027-03-29','2027-05-01','2027-05-06','2027-05-17','2027-12-25','2027-12-26']);
const _osl=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false,weekday:'short'});
function oslo(d){const o={};_osl.formatToParts(d).forEach(p=>o[p.type]=p.value);return {dato:`${o.year}-${o.month}-${o.day}`,time:Number(o.hour)%24,uke:o.weekday};}
function erDag(d){const o=oslo(d); if(o.uke==='Sat'||o.uke==='Sun'||HELLIG.has(o.dato)) return false; return o.time>=6&&o.time<22;}
const strOre=()=>TARIFF.norgespris+TARIFF.paslag;
const nettOre=dag=>(dag?TARIFF.nettDag:TARIFF.nettNatt)+TARIFF.avgift;
function effektKr(kw){ for(const [g,k] of TARIFF.effekt) if(kw<g) return k; return null; }
/* Summer kWh og kroner fra en liste med {t,v(W)} der hver post dekker «min» minutter */
function kostFra(arr,min,fra,til){
  let kD=0,kN=0;
  (arr||[]).forEach(e=>{const t=e.t.getTime(); if(t<fra||t>=til) return; const kwh=e.v*min/60/1000; if(erDag(e.t)) kD+=kwh; else kN+=kwh;});
  return {kD,kN,kwh:kD+kN, strom:(kD+kN)*strOre()/100, nett:(kD*nettOre(true)+kN*nettOre(false))/100};
}
// Bøtter med ukjent oppløsning (Homey bytter fra 1 t til 6 t utover i måneden): fordel hver bøtte time for time
function kostBotter(arr,fra,til){
  let kD=0,kN=0; const a=(arr||[]).filter(e=>e&&e.v!=null).sort((x,y)=>x.t-y.t); if(!a.length) return null;
  const d=[]; for(let i=1;i<a.length;i++) d.push(a[i].t-a[i-1].t); d.sort((x,y)=>x-y);
  const step=d.length?d[Math.floor(d.length/2)]:3600000;
  a.forEach(e=>{ const t0=e.t.getTime(), t1=t0+step;
    for(let h=t0; h<t1; h+=3600000){ const s0=Math.max(h,fra), s1=Math.min(h+3600000,t1,til); if(s1<=s0) continue;
      const kwh=e.v*(s1-s0)/3600000/1000; if(erDag(new Date(s0))) kD+=kwh; else kN+=kwh; } });
  return {kD,kN,kwh:kD+kN,strom:(kD+kN)*strOre()/100,nett:(kD*nettOre(true)+kN*nettOre(false))/100,step};
}
function kostnad(){
  const now=new Date(), o=oslo(now);
  const dagStart=now.getTime()-((o.time*60+now.getMinutes())*60000+now.getSeconds()*1000);
  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(), dagNr=now.getDate();
  const kw=S.step?.avg, eff=kw!=null?effektKr(kw):TARIFF.effekt[0][1];
  const fastDag=(TARIFF.lyseMnd+(eff||0))/dim;
  // I dag: 5-min data fra Insights + sanntid etter siste bøtte
  const td=kostFra(S.pw5,5,dagStart,now.getTime()+1);
  const lastEnd=(S.pw5&&S.pw5.length)?S.pw5[S.pw5.length-1].t.getTime()+300000:dagStart;
  const live=(S.pwLive||[]).filter(x=>x.t>=Math.max(lastEnd,dagStart));
  if(live.length){const a=live.reduce((s,x)=>s+x.w,0)/live.length, m=(now.getTime()-Math.max(lastEnd,dagStart))/60000, kwh=a*m/60/1000, dag=erDag(now);
    if(dag) td.kD+=kwh; else td.kN+=kwh; td.kwh+=kwh; td.strom+=kwh*strOre()/100; td.nett+=kwh*nettOre(dag)/100;}
  if(!td.kwh){ const k=v(ID.pulse,'meter_power'); if(k==null) return null; td.kwh=k; td.strom=k*strOre()/100; td.nett=k*nettOre(true)/100; td.approx=true; }
  // Hittil i måneden: timesnitt fra Insights (thisMonth)
  const mStart=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  // Tidligere dager fra månedsbøtter + i dag fra 5-min-data (månedsbøttene henger opptil 6 t etter)
  const fo=S.pwMonth?kostBotter(S.pwMonth,mStart,dagStart):null;
  const mn=fo?{kD:fo.kD+td.kD,kN:fo.kN+td.kN,kwh:fo.kwh+td.kwh,strom:fo.strom+td.strom,nett:fo.nett+td.nett}:null;
  const var_m=mn?mn.strom+mn.nett:null;
  const fastM=TARIFF.lyseMnd+(eff||0);
  const elapsed=(now.getTime()-mStart)/86400000;
  const prog=var_m!=null&&elapsed>0.5?var_m/elapsed*dim+fastM:null;
  return {td, dagSum:td.strom+td.nett+fastDag, fastDag, mn, mndSum:var_m!=null?var_m+fastM*(dagNr/dim):null, prog, eff, kw};
}

  ['martine','jm','julie','stue'].forEach(k=>{const c=v(ID[k],'measure_co2'),st=co2St(c); if(st==='warn'||st==='crit') A.push([st,`CO₂ ${RN(k)} ${c} ppm`]);});

  return A.sort((a,b)=>(a[0]==='crit'?0:1)-(b[0]==='crit'?0:1));
}

/* Lufting garasje – samme formel og grenser som HomeyScript garasje_lufting v1.4 */
const LUFT={AH_START:1.0,AH_STOPP:0.3,RF_START:65,RF_STOPP:58,MIN_T:4};
const absFukt=(t,rf)=>{const ps=6.112*Math.exp((17.67*t)/(t+243.5));return ps*rf*2.1674/(273.15+t)};
function luftVurdering(){
  const tI=v(ID.garasje,'measure_temperature'), rI=v(ID.garasje,'measure_humidity'), tU=v(ID.ute,'measure_temperature'), rU=v(ID.ute,'measure_humidity');
  if([tI,rI,tU,rU].some(x=>x==null)) return null;
  const aI=absFukt(tI,rI), aU=absFukt(tU,rU), d=aI-aU, apen=v(ID.port,'alarm_contact')===true;
  const lonner=d>=LUFT.AH_START&&rI>=LUFT.RF_START&&tI>=LUFT.MIN_T;
  const hjelperIkke=d<LUFT.AH_STOPP||rI<LUFT.RF_STOPP||tI<LUFT.MIN_T-1;
  let st,txt;
  if(lonner&&!apen){st='ok';txt='Luft nå';}
  else if(lonner&&apen){st='ok';txt='Lufter – la stå';}
  else if(apen&&hjelperIkke){st='warn';txt='Lukk porten';}
  else if(rI<LUFT.RF_START){st='n';txt='Ikke behov';}
  else {st='n';txt='Ikke nå';}
  const why = rI<LUFT.RF_START?`Fukt inne ${f(rI,0)} % – under ${LUFT.RF_START} %`
            : tI<LUFT.MIN_T?`For kaldt i garasjen (${f(tI)} °C)`
            : d<0?`Uteluften er ${f(-d,1)} g/m³ fuktigere enn inne – ikke luft`
            : d<LUFT.AH_START?`Uteluften er bare ${f(d,1)} g/m³ tørrere – trenger ${f(LUFT.AH_START,1)}`
            : `Uteluften er ${f(d,1)} g/m³ tørrere`;
  return {st,txt,why,aI,aU,d,apen};
}

   fordi en https-side ikke får lov å kalle http://192.168… direkte. */
function localUrl(x){ x=String(x).trim().replace(/\/+$/,''); if(/^https?:\/\//.test(x)) return x;
  if(/^(\d{1,3}\.){3}\d{1,3}$/.test(x)) return 'https://'+x.replace(/\./g,'-')+'.homey.homeylocal.com'; return 'https://'+x; }
async function pickBase(){

async function hget(path){
  const {base,key}=cfg();
  let r;
  try{ r=await fetch(base+path,{headers:{Authorization:'Bearer '+key}}); }
  catch(e){ const err=new Error('NETT'); err.kind='net'; throw err; }
  if(r.status===401||r.status===403){const err=new Error('Nøkkel avvist ('+r.status+')');err.kind='auth';throw err;}
  if(!r.ok){const err=new Error('HTTP '+r.status);err.kind='http';throw err;}
  return r.json();
}
let INS_OK=null; // husker hvilken URL-variant Homey godtar
async function insights(devId,cap,res){
  const full=`homey:device:${devId}:${cap}`, uri=`homey:device:${devId}`;
  const variants=[
    `/api/manager/insights/log/${uri}/${full}/entry?resolution=${res}`,
    `/api/manager/insights/log/${encodeURIComponent(uri)}/${encodeURIComponent(full)}/entry?resolution=${res}`,
    `/api/manager/insights/log/${full}/entry?resolution=${res}`,
    `/api/manager/insights/log/${encodeURIComponent(full)}/entry?resolution=${res}`,
    `/api/manager/insights/log/${uri}/${cap}/entry?resolution=${res}`,
    `/api/manager/insights/log/${encodeURIComponent(uri)}/${cap}/entry?resolution=${res}`
  ];
  const order=INS_OK!=null?[INS_OK,...variants.keys()].filter((x,i,a)=>a.indexOf(x)===i):[...variants.keys()];
  let last='ingen data';
  for(const i of order){
    try{ const j=await hget(variants[i]); const arr=Array.isArray(j)?j:(j.values||j.entries||[]);
      if(arr.length){ INS_OK=i; return arr.map(e=>({t:new Date(e.t),v:e.v})).filter(e=>e.v!=null); }
      last='tom logg';
    }catch(e){ last=e.kind==='auth'?'Homey svarte '+e.message.replace(/\D/g,'')+' – mangler nøkkelen «Vis Insights»?':e.kind==='net'?'ingen kontakt':e.message; if(e.kind==='auth') break; }
  }
  const err=new Error(last); err.kind='ins'; throw err;
}

async function loadVaattid(){

const POS={get lat(){return LAT},get lon(){return LON}};
const rad=Math.PI/180;
function solOppNed(dato0){ // NOAA, zenith 90.833
  const res={}; const y=dato0.getFullYear(), m=dato0.getMonth(), d=dato0.getDate();
  const N=Math.floor((Date.UTC(y,m,d)-Date.UTC(y,0,0))/86400000), lh=POS.lon/15;
  [['opp',6],['ned',18]].forEach(([k,h0])=>{
    const t=N+((h0-lh)/24), M=0.9856*t-3.289;
    let L=(M+1.916*Math.sin(M*rad)+0.020*Math.sin(2*M*rad)+282.634+360)%360;
    let RA=Math.atan(0.91764*Math.tan(L*rad))/rad; RA=(RA+360)%360; RA+= (Math.floor(L/90)*90-Math.floor(RA/90)*90); RA/=15;
    const sd=0.39782*Math.sin(L*rad), cd=Math.cos(Math.asin(sd));
    const cH=(Math.cos(90.833*rad)-sd*Math.sin(POS.lat*rad))/(cd*Math.cos(POS.lat*rad));
    if(cH>1||cH<-1){ res[k]=null; return; }
    let H=k==='opp'?360-Math.acos(cH)/rad:Math.acos(cH)/rad; H/=15;
    const T=H+RA-0.06571*t-6.622; const UT=((T-lh)%24+24)%24;
    res[k]=new Date(Date.UTC(y,m,d)+UT*3600000);
  });
  return res;
}
function maane(now){
  const d=(now.getTime()-Date.UTC(2000,0,1,12))/86400000;
  const L=280.460+0.9856474*d, g=(357.528+0.9856003*d)*rad, ls=L+1.915*Math.sin(g)+0.020*Math.sin(2*g);
  const Lm=218.316+13.176396*d, Mm=(134.963+13.064993*d)*rad, D=(297.850+12.190749*d)*rad;
  const lm=Lm+6.289*Math.sin(Mm)+1.274*Math.sin(2*D-Mm)+0.658*Math.sin(2*D)+0.214*Math.sin(2*Mm)-0.186*Math.sin(g)-0.114*Math.sin(2*(93.272+13.229350*d)*rad);
  const e=((lm-ls)%360+360)%360, k=(1-Math.cos(e*rad))/2;
  const idx=Math.floor(((e+22.5)%360)/45);
  const navn=['Nymåne','Voksende månesigd','Første kvarter','Voksende måne','Fullmåne','Minkende måne','Siste kvarter','Minkende månesigd'][idx];
  const tilFull=((180-e+360)%360)/12.19, tilNy=((360-e)%360)/12.19;
  return {e,k,idx,navn,tilFull,tilNy};
}
function maaneSvg(e,k){
  const r=30,cx=36,cy=36, rx=Math.abs(1-2*k)*r, vox=e<180, gib=k>0.5;
  let p;
  if(vox) p=`M${cx} ${cy-r} A${r} ${r} 0 0 1 ${cx} ${cy+r} A${rx} ${r} 0 0 ${gib?1:0} ${cx} ${cy-r}Z`;
  else p=`M${cx} ${cy-r} A${r} ${r} 0 0 0 ${cx} ${cy+r} A${rx} ${r} 0 0 ${gib?0:1} ${cx} ${cy-r}Z`;
  return `<svg width="72" height="72" viewBox="0 0 72 72" aria-label="Månen ${Math.round(k*100)} % opplyst"><defs><radialGradient id="mgl"><stop offset=".75" stop-color="#ece7e1" stop-opacity=".18"/><stop offset="1" stop-color="#ece7e1" stop-opacity="0"/></radialGradient></defs>
   <circle cx="${cx}" cy="${cy}" r="35" fill="url(#mgl)" opacity="${0.3+k*0.7}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#2a2b30" stroke="#3a3c42"/>${k>0.005?`<path d="${p}" fill="#ece7e1"/>`:''}</svg>`;

function solMaanePanel(){
  const now=new Date(), s=solOppNed(now), sg=solOppNed(new Date(now.getTime()-86400000));

function avvikVarighet(A){
  let mem={}; try{ mem=JSON.parse(localStorage.getItem('anlegg.avvik')||'{}'); }catch(e){}
  const now=Date.now(), ny={};
  const out=A.map(([s,t])=>{ const k=s+'|'+t.replace(/[\d.,]+/g,'#'); const t0=mem[k]||now; ny[k]=t0;
    const m=(now-t0)/60000, va=m<1?'ny':m<60?Math.round(m)+' min':m<2880?Math.round(m/60)+' t':Math.round(m/1440)+' d';
    return [s,t,va]; });

  return out;
}

      else if(start!=null){ if(tt>=t0&&L.off) events.push({t:e.t,L,on:false,dur:tt-start}); start=null; } });
    L.aktivNa=start!=null?start:null; });
  events.sort((p,q)=>q.t-p.t);
  if(key==='loe'){ const doors=events.filter(e=>e.L.n==='Dør'&&e.on).map(e=>e.t); S.doorEv=S.doorEv&&S.doorEv.length>doors.length?S.doorEv:doors.slice().reverse(); }
  const cnt=lanes.map(L=>`${L.on}: ${events.filter(e=>e.L===L&&e.on).length}`).join(' · ')+lanes.filter(L=>L.aktivNa!=null&&L.off).map(L=>` · <b class="c-warn">${L.n} åpen nå (${varTxt(t1-L.aktivNa)})</b>`).join('');
  const list=events.slice(0,40).map(e=>{ const c=e.on?e.L.c:'#5fbf8f';
    const ekstra=e.on?(e.L.n==='Bevegelse'&&key==='loe'?(tolkBevegelse(e.t)==='person'?' <em class="c-warn">– med døråpning</em>':' <em>– trolig katt</em>'):''):` <em>– var åpen ${varTxt(e.dur)}</em>`;
    return `<div><span class="t">${tidTxt(e.t)}</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c};margin-right:7px;vertical-align:1px"></i>${e.on?e.L.on:e.L.off}${ekstra}</span></div>`; }).join('');
  return eventChart(lanes,t0,t1)+`<div class="evk">${cnt}</div><div class="evlist">${list||'<div>Ingen hendelser i perioden</div>'}</div>`;
}

async function showDetail(res){
  if(!DET) return; Object.keys(HC).forEach(k=>delete HC[k]); const [id,cap,title,unit,thr]=DET, body=document.getElementById('detBody');
  document.getElementById('detTitle').textContent=title;
  document.querySelectorAll('#det .seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.r===res)));
  body.innerHTML='<div class="nohist">Henter …</div>';
  try{
    if(id==='BATT'){ document.querySelector('#det .seg').style.visibility='hidden';
      const L=S.alleBatt||[]; const col=b=>b<=10?C.crit:b<LIM.batt?C.warn:C.ok;
      body.innerHTML=`<div class="evk">${L.length} enheter med batteri · gul under ${LIM.batt} % · rød under 10 %</div><div class="blist">`+L.map(o=>`<div><span>${esc(o.n)}${o.ubrukt?' <em>(ubrukt)</em>':''}<small>${o.t?'rapportert '+tidTxt(o.t):''}</small></span><span class="bb"><i style="width:${Math.max(2,o.b)}%;background:${col(o.b)}"></i></span><span class="p" style="color:${col(o.b)}">${f(o.b,0)} %</span></div>`).join('')+'</div>';
      return; }
    document.querySelector('#det .seg').style.visibility='';
    if(id==='EV'){ body.innerHTML=await visHendelser(cap,res); }
    else if(id==='PUMPE'){
      const P=pumpeStat(), a=await hentPeriode(ID.pumpe,'energy_power',res);
      body.innerHTML=(P?`<div class="ph">Kjøretid per døgn<small>siste ${P.d.length} døgn</small></div>${pumpeBars(P.d,'big')}<div class="evk num">I dag ${minF(P.last)} min · snitt ${minF(P.avg)} min/døgn · høyeste ${minF(P.mx)} min · beregnet fra strømbruk ÷ ${PUMPE_W} W</div><div class="ph" style="margin-top:10px">Effekt</div>`:'')+bigChart(a,'W',null);
    }
    else if(id==='PHASES'){
      const P=ID.pulse;
      const [pw,l1,l2,l3]=await Promise.all([hentPeriode(P,'energy_power',res),hentPeriode(P,'measure_current.L1',res).catch(()=>null),hentPeriode(P,'measure_current.L2',res).catch(()=>null),hentPeriode(P,'measure_current.L3',res).catch(()=>null)]);
      body.innerHTML=bigChart(pw,'W',LIM.step*1000)+'<div class="ph" style="margin-top:6px">Faser</div>'+faseNaa()+multiChart([{n:'L1',c:'#ff8a3d',a:l1},{n:'L2',c:'#9cc3dc',a:l2},{n:'L3',c:'#c9a7e6',a:l3}],'A')+vvbPanel(l3,res);
    } else {
      const a=await hentPeriode(id,cap,res); body.innerHTML=bigChart(a,unit,thr===''?null:parseFloat(thr));
    }
  }catch(e){ body.innerHTML=`<div class="nohist">Fikk ikke hentet historikk (${esc(e.message)})</div>`; }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-det]'); if(!el||S.mode!=='live') return;
  DET=el.dataset.det.split('|'); document.getElementById('det').showModal(); showDetail('last24Hours');
});
document.addEventListener('DOMContentLoaded',()=>{

/* ---------- Automatisk oppdatering av selve dashbordet (GitHub Pages) ---------- */
const VMON=/^homey-dashbord-v(\d+)\.(\d+)\.html$/;
async function checkUpdate(){
  try{
    if(!location.hostname.endsWith('github.io')) return;
    const cur=location.pathname.split('/').pop(); if(!VMON.test(cur)) return;
    const eier=location.hostname.split('.')[0], repo=location.pathname.split('/').filter(Boolean)[0];
    const r=await fetch(`https://api.github.com/repos/${eier}/${repo}/contents/?t=${Date.now()}`,{cache:'no-store'}); if(!r.ok) return;
    const ny=(await r.json()).map(x=>x.name).filter(n=>VMON.test(n)).sort((a,b)=>{const[,a1,a2]=a.match(VMON),[,b1,b2]=b.match(VMON);return (b1-a1)||(b2-a2)})[0];
    if(!ny||ny===cur) return;
    const [,n1,n2]=ny.match(VMON).map(Number),[,c1,c2]=cur.match(VMON).map(Number);
    if(n1<c1||(n1===c1&&n2<=c2)) return;            // bare oppgrader, aldri nedgrader
    if(window.top!==window) window.top.location.reload(); else location.href=ny;
  }catch(e){}
}
setInterval(checkUpdate,3600000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(); });

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('bSet').addEventListener('click',openSettings);
  document.getElementById('dlgCancel').addEventListener('click',()=>document.getElementById('dlg').close());
  document.getElementById('dlgForget').addEventListener('click',()=>{store.del('homey.key');store.del('homey.base');store.del('homey.name');store.del('homey.local');S.base=null;setTitle();document.getElementById('dlg').close();start();});
  document.getElementById('dlgForm').addEventListener('submit',e=>{e.preventDefault();
    const b=document.getElementById('fBase').value.trim(), k=document.getElementById('fKey').value.trim(), nm=document.getElementById('fName').value.trim();
    if(nm) store.set('homey.name',nm); else store.del('homey.name'); setTitle();
    if(b){ const isLocal=/^(\d{1,3}\.){3}\d{1,3}(:\d+)?$/.test(b.replace(/\/.*$/,''))||/\.local(:\d+)?$/.test(b.replace(/\/.*$/,'')); store.set('homey.base',/^https?:\/\//.test(b)?b:(isLocal?'http://':'https://')+b); }
    if(k&&!k.startsWith('•')) store.set('homey.key',k);
    const lo=document.getElementById('fLocal').value.trim(); if(lo) store.set('homey.local',lo); else store.del('homey.local');
    const pos=document.getElementById('fPos').value.split(',').map(x=>parseFloat(x.trim().replace(/\s/g,'')));
    if(pos.length===2&&pos.every(x=>isFinite(x))){ PRIV.lat=+pos[0].toFixed(3); PRIV.lon=+pos[1].toFixed(3); } else { delete PRIV.lat; delete PRIV.lon; }
    const st=document.getElementById('fSted').value.trim(); if(st) PRIV.sted=st; else delete PRIV.sted;
    const rn=document.getElementById('fRom').value.split(',').map(x=>x.trim()); PRIV.rom={}; ['martine','jm','julie'].forEach((k,i)=>{ if(rn[i]) PRIV.rom[k]=rn[i]; });
    try{ localStorage.setItem('anlegg.priv',JSON.stringify(PRIV)); }catch(e){}
    LAT=+PRIV.lat||null; LON=+PRIV.lon||null; loadYr();
    S.base=null;
    document.getElementById('dlg').close(); start();});
  setTitle(); render(); start(); loadYr(); setTimeout(checkUpdate,8000); tYr=setInterval(loadYr,1800000);
});
