<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<!-- Fast startside for Homey-dashbordet. Index v2.1
     Finner SELV nyeste homey-dashbord-vX.Y.html i repoet (via GitHub sitt åpne API)
     og viser den inne i denne siden. Ved ny versjon: last bare opp den nye dashbord-fila.
     RESERVE brukes hvis GitHub ikke svarer. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anlegg</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anlegg">
<meta name="theme-color" content="#1c1d20">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="homey-ikon.png">
<style>
  html,body{margin:0;height:100%;background:#1c1d20;overflow:hidden}
  iframe{position:fixed;top:env(safe-area-inset-top);left:env(safe-area-inset-left);right:env(safe-area-inset-right);bottom:0;width:calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));height:calc(100% - env(safe-area-inset-top));border:0;display:block;background:#1c1d20}
</style>
</head>
<body>
<iframe id="app" title="Anlegg"></iframe>
<script>
  const RESERVE = 'homey-dashbord-v4.2.html';            // brukes bare hvis GitHub ikke svarer
  const MONSTER = /^homey-dashbord-v(\d+)\.(\d+)\.html$/;

  async function finnNyeste(){
    // eier = første del av vertsnavnet (bruker.github.io), repo = første del av stien (/anlegg/)
    const eier = location.hostname.split('.')[0];
    const repo = location.pathname.split('/').filter(Boolean)[0];
    if (!location.hostname.endsWith('github.io') || !repo) return RESERVE;
    const r = await fetch(`https://api.github.com/repos/${eier}/${repo}/contents/?t=${Date.now()}`, {cache:'no-store'});
    if (!r.ok) throw new Error('GitHub ' + r.status);
    const filer = (await r.json()).map(x => x.name).filter(n => MONSTER.test(n));
    if (!filer.length) return RESERVE;
    filer.sort((a,b) => { const [,a1,a2]=a.match(MONSTER), [,b1,b2]=b.match(MONSTER); return (b1-a1)||(b2-a2); });
    return filer[0];
  }

  (async () => {
    let fil = RESERVE;
    try { fil = await finnNyeste(); try{ localStorage.setItem('anlegg.nyeste', fil); }catch(e){} }
    catch(e){ try{ fil = localStorage.getItem('anlegg.nyeste') || RESERVE; }catch(_){} }
    document.getElementById('app').src = fil + location.hash;
  })();
</script>
</body>
</html>
